<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MIDI Pattern Generator</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#0b1220;color:#e5e7eb}
main{max-width:900px;margin:0 auto;padding:48px 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.card{background:#111a2e;border:1px solid #1e293b;border-radius:16px;padding:16px}
label{display:block;font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:#94a3b8;margin-bottom:8px}
input,select{width:100%;padding:10px;border:1px solid #273449;background:#0b1220;color:#e5e7eb;border-radius:10px}
button{padding:12px 18px;border:0;border-radius:12px;font-weight:700;cursor:pointer}
.primary{background:#38bdf8;color:#082f49}
.secondary{background:#1e293b;color:#e2e8f0}
pre{background:#0d1626;border:1px solid #1e293b;border-radius:12px;padding:16px;overflow:auto;white-space:pre-wrap}
</style>
</head>
<body>
<main>
<h1>MIDI Pattern Generator</h1>
<p>Generate chords, bass, and arpeggios, preview them, and export a Standard MIDI File.</p>
<div class="grid">
<div class="card"><label>Root note</label><select id="key"><option value="0">C</option><option value="1">C#</option><option value="2">D</option><option value="3">D#</option><option value="4">E</option><option value="5">F</option><option value="6">F#</option><option value="7">G</option><option value="8">G#</option><option value="9">A</option><option value="10">A#</option><option value="11">B</option></select></div>
<div class="card"><label>Scale</label><select id="scale"><option value="maj">Major</option><option value="min">Minor</option><option value="dor">Dorian</option><option value="phr">Phrygian</option><option value="mix">Mixolydian</option></select></div>
<div class="card"><label>Tempo</label><input id="bpm" type="number" value="120" min="40" max="240"></div>
<div class="card"><label>Bars</label><input id="bars" type="number" value="4" min="1" max="16"></div>
<div class="card"><label>Arp pattern</label><select id="pattern"><option value="up">Up</option><option value="down">Down</option><option value="updown">Up/Down</option><option value="random">Random</option></select></div>
<div class="card"><label>Density</label><select id="density"><option value="4">1/4</option><option value="8" selected>1/8</option><option value="16">1/16</option></select></div>
</div>
<div style="margin-top:24px"><button class="primary" id="gen">Generate</button> <button class="secondary" id="preview">Preview</button> <button class="secondary" id="download" disabled>Export .mid</button></div>
<pre id="out">Nothing generated yet.</pre>
</main>
<script>
const $=id=>document.getElementById(id);
const scales={maj:[0,2,4,5,7,9,11],min:[0,2,3,5,7,8,10],dor:[0,2,3,5,7,9,10],phr:[0,1,3,5,7,8,10],mix:[0,2,4,5,7,9,10]};
let data=null,ctx=null;
function chord(deg){const s=scales[$('scale').value],r=+$('key').value;const i=s[deg%7]+(deg>=7?12:0),j=s[(deg+2)%7]+(deg+2>=7?12:0),k=s[(deg+4)%7]+(deg+4>=7?12:0);return [60+r+i,60+r+i+j,60+r+i+k];}
function arp(step,sp,p,len){const pos=step%sp,q=pos/(sp-1),r=len-1;if(p==='up')return Math.round(q*r);if(p==='down')return r-Math.round(q*r);if(p==='updown'){const m=pos%(r*2);return m<=r?m:r*2-m;}return Math.floor(Math.random()*len);}
function generate(){const bars=Math.max(1,Math.min(16,+$('bars').value||4)),sp=+$('density').value,total=bars*sp,p=$('pattern').value,notes=[];for(let s=0;s<total;s++){const beat=s/sp,c=chord(Math.floor(beat*2)%4),a=arp(s,sp,p,c.length);notes.push({t:beat,d:.9,m:c[0],ch:1},{t:beat,d:.9,m:c[1],ch:1},{t:beat,d:.9,m:c[2],ch:1});if(s%2===0)notes.push({t:beat,d:.45,m:c[0]-12,ch:2});if(a!==null)notes.push({t:beat,d:.45,m:c[a],ch:3});}data={notes,bars,bpm:+$('bpm').value||120};$('out').textContent=notes.slice(0,100).map(n=>`ch${n.ch} beat ${n.t.toFixed(2)} midi ${n.m}`).join('\n');$('download').disabled=false;return data;}
function vlq(v){const a=[];do{let b=v&127;v>>=7;if(a.length)b|=128;a.unshift(b);}while(v);return a;}
function midiBytes(){const tpb=480,t=Math.round(6e7/data.bpm),head=[77,84,104,100,0,0,0,6,0,1,0,3,tpb>>8,tpb&255],chunks=[head];for(let c=1;c<=3;c++){const ev=[[0,[255,81,3,t>>16&255,t>>8&255,t&255]]],ns=data.notes.filter(n=>n.ch===c).sort((a,b)=>a.t-b.t);let last=0,lastOff=0;for(const n of ns){const tick=Math.round(n.t*tpb),off=Math.round((n.t+n.d)*tpb);ev.push([tick-last,[144,n.m,100]]);ev.push([off-tick,[128,n.m,0]]);last=tick;lastOff=off;}ev.push([0,[255,47,0]]);const bytes=[];for(const [d,b] of ev){bytes.push(...vlq(d),...b);}chunks.push([77,84,114,107,bytes.length>>24&255,bytes.length>>16&255,bytes.length>>8&255,bytes.length&255,...bytes]);}return new Uint8Array(chunks.flat());}
function exportMidi(){if(!data)generate();const b=midiBytes(),url=URL.createObjectURL(new Blob([b],{type:'audio/midi'})),a=document.createElement('a');a.href=url;a.download=`pattern-${$('key').value}-${$('scale').value}-${data.bpm}bpm.mid`;a.click();URL.revokeObjectURL(url);}
async function preview(){if(!data)generate();if(!ctx)ctx=new AudioContext();if(ctx.state==='suspended')await ctx.resume();const start=ctx.currentTime+.05,spb=60/data.bpm;for(const n of data.notes.slice(0,64)){const t=start+n.t*spb,o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=440*Math.pow(2,(n.m-69)/12);o.type=n.ch===2?'triangle':'sawtooth';g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.06,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+n.d*spb);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+n.d*spb);}}
$('gen').onclick=generate;$('preview').onclick=preview;$('download').onclick=exportMidi;
</script>
</body>
</html>
